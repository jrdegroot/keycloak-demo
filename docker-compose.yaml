services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    ports:
      - "8180:8180"
    environment:
      KEYCLOAK_ADMIN: admin 
      KEYCLOAK_ADMIN_PASSWORD: password
    command: 
      - start-dev 
      - --http-port=8180
      - --import-realm
    volumes:
      - ./keycloak-data/realm.json:/opt/keycloak/data/import/realm.json