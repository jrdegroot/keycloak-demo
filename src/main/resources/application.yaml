spring:
  application:
    name: keycloak-demo
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${issuer}
  datasource:
    url: jdbc:h2:mem:keycloakdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true


issuer: http://localhost:8180/realms/demo-realm
frontend:
  url: http://localhost:4200/


logging:
  level:
    root: INFO
    controller: DEBUG
    config: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.cors: DEBUG
